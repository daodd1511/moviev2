# moviev2 — React SPA + express API behind ONE public hostname.
# Cloudflare public hostname → http://movie-web:80
#
# The API is deliberately not on `edge` and has no tunnel route: its only reachable
# path is through nginx in the web container, over the private `internal` network.
name: moviev2

services:
  api:
    build:
      context: ./apps/api
    image: movie-api:local
    container_name: movie-api
    pull_policy: build # build-only image, never in a registry
    environment:
      NODE_ENV: production
      PORT: "4000"
      MONGO_URI: ${MONGO_URI:?}
      TOKEN_KEY: ${TOKEN_KEY:?}
      # GMAIL / GMAIL_PASSWORD intentionally absent: the nodemailer password-reset
      # flow in src/service/authService.js is commented out, so nothing reads them.
      # Re-add here if that flow is ever restored.
    restart: unless-stopped
    networks: [internal]

  web:
    build:
      context: ./apps/web
      args:
        # Build args land in the shipped bundle — PUBLIC values only. The TMDB key is
        # client-side by design here; it already ships in the current Vercel bundle.
        VITE_APP_BACKEND_API_URL: /api
        VITE_APP_API_BASE_URL: ${VITE_APP_API_BASE_URL:?}
        VITE_APP_TMDB_API_KEY: ${VITE_APP_TMDB_API_KEY:?}
        VITE_APP_IS_PRODUCTION: "true"
        APP_COMMIT: ${APP_COMMIT:-}
    image: movie-web:local
    container_name: movie-web
    pull_policy: build
    depends_on: [api]
    restart: unless-stopped
    networks: [internal, edge]

networks:
  # Private: api is reachable from web, and from nothing else on the box.
  internal:
  edge:
    name: edge
    external: true
