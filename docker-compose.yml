# moviev2 — React SPA + express API, built locally. LOCAL USE ONLY.
#
# Production does not use this file: CI builds the images and the private deploy repo
# runs them on the server, tunnel included. Nothing here is externally reachable.
#
# The API has no published port — its only path is through nginx in the web container,
# over the private `internal` network, exactly as in production.
name: moviev2

services:
  api:
    build:
      context: ./apps/api
    image: movie-api:local
    container_name: movie-api
    pull_policy: build # build-only image, never in a registry
    environment:
      NODE_ENV: production
      PORT: "4000"
      MONGO_URI: ${MONGO_URI:?}
      TOKEN_KEY: ${TOKEN_KEY:?}
      # GMAIL / GMAIL_PASSWORD intentionally absent: the nodemailer password-reset
      # flow in src/service/authService.js is commented out, so nothing reads them.
      # Re-add here if that flow is ever restored.
    restart: unless-stopped
    networks: [internal]

  web:
    build:
      context: ./apps/web
      args:
        # Build args land in the shipped bundle — PUBLIC values only. The TMDB key is
        # client-side by design here; it already ships in the current Vercel bundle.
        VITE_APP_BACKEND_API_URL: /api
        VITE_APP_API_BASE_URL: ${VITE_APP_API_BASE_URL:?}
        VITE_APP_TMDB_API_KEY: ${VITE_APP_TMDB_API_KEY:?}
        VITE_APP_IS_PRODUCTION: "true"
        APP_COMMIT: ${APP_COMMIT:-}
    image: movie-web:local
    container_name: movie-web
    pull_policy: build
    depends_on: [api]
    restart: unless-stopped
    # Nothing reaches this stack otherwise now that the tunnel lives with the
    # production compose in the deploy repo. http://localhost:8080
    ports:
      - "8080:80"
    networks: [internal]

networks:
  # Private: api is reachable from web, and from nothing else on the box.
  internal:
