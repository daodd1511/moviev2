name: build

# Public repo. Push-to-main only, and no self-hosted runner is registered here — a
# fork PR must never be able to execute on the deploy server. Deployment lives in the
# private daodd1511/deploy repo, notified by the dispatch job at the bottom.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Queue rather than cancel: a cancelled publish could leave `latest` pointing at an
# image whose sha tag was never dispatched.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}-web:${{ github.sha }}
            ghcr.io/${{ github.repository }}-web:latest
          # Compiled into the browser bundle, so these are PUBLIC by definition and
          # live in Actions *variables*, not secrets. Never add a real secret here.
          build-args: |
            VITE_APP_BACKEND_API_URL=/api
            VITE_APP_IS_PRODUCTION=true
            VITE_APP_API_BASE_URL=${{ vars.VITE_APP_API_BASE_URL }}
            VITE_APP_TMDB_API_KEY=${{ vars.VITE_APP_TMDB_API_KEY }}
            APP_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  build-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # No build-args: MONGO_URI / TOKEN_KEY are runtime container env, injected by
      # compose from the server's .env. They must never reach the image.
      - uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}-api:${{ github.sha }}
            ghcr.io/${{ github.repository }}-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  dispatch-deploy:
    needs: [build-web, build-api]
    # Upstream only. Forks publish to their own GHCR namespace but must not reach
    # the deploy repo.
    if: github.repository == 'daodd1511/moviev2'
    runs-on: ubuntu-latest
    # The images are the artifact; this is only a notification. Until the deploy repo
    # and its token exist, the pipeline runs publish-only and the run stays green.
    continue-on-error: true
    steps:
      - name: Trigger deploy
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TRIGGER_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "DEPLOY_TRIGGER_TOKEN not set — publish-only mode, skipping dispatch."
            exit 0
          fi
          gh api repos/daodd1511/deploy/dispatches \
            -f event_type=deploy \
            -f 'client_payload[app]=moviev2' \
            -f 'client_payload[tag]=${{ github.sha }}'
