name: deploy

# push-only. NO `pull_request:` trigger — this repo is public and the deploy job runs
# on a self-hosted runner on a personal machine. A PR trigger would let a fork run
# arbitrary code there. Forks cannot push to main, so this is safe as written.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    # Forks that copy this workflow would otherwise try to deploy to nothing.
    if: github.repository == 'daodd1511/moviev2'
    uses: daodd1511/deploy/.github/workflows/deploy.yml@main
    with:
      app: moviev2
      # apps/web has no test script; the Dockerfile typechecks via `tsc` and
      # vite-plugin-checker, so a bad build fails the deploy loudly.
      check-command: ""
      health-url: http://movie-web/healthz
    secrets: inherit
