server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Docker's embedded DNS with a variable upstream. nginx resolves a literal
    # upstream ONCE at startup, so `docker compose up -d api` on its own would leave
    # this proxying to a dead IP and 502ing until web also restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $movie_api http://api:4000;

    # Same-origin API. The SPA is built with VITE_APP_BACKEND_API_URL=/api and express
    # mounts its router at /api, so the path forwards unchanged. $request_uri is
    # explicit: with a variable proxy_pass, nginx does not append the path for you.
    location /api/ {
        proxy_pass $movie_api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Real dependency health (reaches the API), for uptime monitoring.
    location = /health {
        proxy_pass $movie_api/health;
    }

    # Static-only health for the deploy gate — green even if the API is down, so a
    # web deploy isn't failed by an unrelated backend outage.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Canonical Collection share URLs. The SPA uses HashRouter, so a fresh (non-hash)
    # load of this path can't be routed client-side — proxy it to the API's share
    # endpoint instead, which returns crawler-readable Open Graph HTML that redirects
    # human browsers into the SPA's hash route. Scoped to the exact id shape so it
    # never shadows /collections/discover or other SPA routes under this prefix.
    location ~ "^/u/[^/]+/(collections|lists)/[0-9a-fA-F]{24}$" {
        proxy_pass $movie_api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA client-side routing fallback (react-router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
